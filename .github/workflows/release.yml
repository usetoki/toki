name: Release

# On a v* tag: cross-compile the addon for every platform (Zig builds them all from
# one Linux host), publish each per-platform package plus the main package to npm,
# and attach the binaries to the GitHub release. Needs the NPM_TOKEN secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0
  # Node version whose Windows import library we link against. N-API is ABI-stable,
  # so one node.lib serves every supported Node.
  NODE_LIB_VERSION: "22.11.0"
  # Run JS actions (e.g. setup-zig@v2) on Node 24 — Node 20 is being retired.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: darwin-arm64, target: aarch64-macos }
          - { triple: darwin-x64, target: x86_64-macos }
          - { triple: linux-x64-gnu, target: x86_64-linux-gnu }
          - { triple: linux-arm64-gnu, target: aarch64-linux-gnu }
          - { triple: win32-x64-msvc, target: x86_64-windows, windows: true }
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cross-compile addon
        shell: bash
        run: |
          if [ -n "${{ matrix.windows }}" ]; then
            curl -sSLo node.lib "https://nodejs.org/dist/v${NODE_LIB_VERSION}/win-x64/node.lib"
            zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dnode-lib="$PWD/node.lib"
          else
            zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
          fi
          mv zig-out/toki.node "toki.${{ matrix.triple }}.node"

      - uses: actions/upload-artifact@v4
        with:
          name: toki-${{ matrix.triple }}
          path: toki.${{ matrix.triple }}.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:ts # compile dist/ (the loader)
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage binaries + sync versions to the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for triple in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            cp "artifacts/toki-${triple}/toki.${triple}.node" "npm/${triple}/"
            (cd "npm/${triple}" && npm version "$version" --no-git-tag-version --allow-same-version)
            npm pkg set "optionalDependencies.@usetoki/toki-${triple}=${version}"
          done
          npm version "$version" --no-git-tag-version --allow-same-version

      # Publishes are idempotent: a version already on npm is skipped (npm versions
      # are immutable), so a half-finished release can be safely re-run on its tag.
      - name: Publish platform packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for triple in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            pkg="@usetoki/toki-${triple}"
            if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
              echo "${pkg}@${version} already published — skipping"
            else
              (cd "npm/${triple}" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@usetoki/toki@${version}" version >/dev/null 2>&1; then
            echo "@usetoki/toki@${version} already published — skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach binaries to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.node
