name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zig toolchain version. Bump together with the local toolchain.
  ZIG_VERSION: 0.16.0

jobs:
  lint:
    name: Lint (zig fmt, tsc, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # A Windows DLL must resolve napi_*/uv_* at link time, so grab Node's import
      # library for the runner's exact version and point the build at it.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ver="$(node -p process.versions.node)"
          curl -sSLo node.lib "https://nodejs.org/dist/v${ver}/win-x64/node.lib"
          zig build -Doptimize=ReleaseFast -Dnode-lib="$PWD/node.lib"
          npm run build:ts

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: npm run build

      - run: npm test
